<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>symbiote-node Spatial Layout</title>
  <style>
    :root {
      --sn-hue: 212;
      --sn-chroma: 0.13;
      --sn-depth: 0.14;
      --sn-bg: oklch(18% var(--sn-chroma) var(--sn-hue));
      --sn-surface: oklch(23% calc(var(--sn-chroma) * 0.82) var(--sn-hue));
      --sn-surface-2: oklch(29% calc(var(--sn-chroma) * 0.78) var(--sn-hue));
      --sn-text: oklch(89% 0.025 var(--sn-hue));
      --sn-muted: oklch(68% 0.036 var(--sn-hue));
      --sn-accent: oklch(72% 0.17 var(--sn-hue));
      --sn-border: color-mix(in oklch, var(--sn-accent) 28%, transparent);
      --sn-gap: 10px;
      --sn-radius: 8px;
      --sn-shadow: 0 22px 72px color-mix(in oklch, black 52%, transparent);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--sn-text);
      background: var(--sn-bg);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 42%, color-mix(in oklch, var(--sn-accent) 14%, transparent), transparent 33%),
        linear-gradient(135deg, color-mix(in oklch, var(--sn-bg) 92%, black), var(--sn-bg));
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px;
      border-right: 1px solid color-mix(in oklch, var(--sn-border) 72%, transparent);
      background: color-mix(in oklch, var(--sn-surface) 64%, transparent);
      backdrop-filter: blur(22px);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 17px;
      font-weight: 650;
    }

    h2 {
      color: var(--sn-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .meta {
      color: var(--sn-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    label {
      color: var(--sn-muted);
      font-size: 12px;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--sn-accent);
    }

    .status {
      display: grid;
      gap: 8px;
      margin-top: auto;
      padding: 12px;
      border: 1px solid color-mix(in oklch, var(--sn-border) 70%, transparent);
      border-radius: var(--sn-radius);
      background: color-mix(in oklch, var(--sn-surface-2) 58%, transparent);
      font-size: 12px;
      line-height: 1.45;
    }

    .stage {
      position: relative;
      overflow: hidden;
      perspective: 980px;
      transform-style: preserve-3d;
    }

    .space {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .floor {
      position: absolute;
      left: 50%;
      bottom: -26%;
      width: 120vw;
      height: 62vh;
      transform: translateX(-50%) rotateX(74deg);
      background:
        linear-gradient(color-mix(in oklch, var(--sn-accent) 13%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in oklch, var(--sn-accent) 13%, transparent) 1px, transparent 1px);
      background-size: 54px 54px;
      opacity: 0.46;
    }

    .panel {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      border: 1px solid var(--sn-border);
      border-radius: var(--sn-radius);
      background:
        linear-gradient(180deg, color-mix(in oklch, var(--sn-surface-2) 88%, white 3%), var(--sn-surface));
      box-shadow: var(--sn-shadow);
      transform-style: preserve-3d;
      transition: border-color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    .panel[data-hit="true"] {
      border-color: var(--sn-accent);
      box-shadow:
        0 0 0 1px color-mix(in oklch, var(--sn-accent) 70%, transparent),
        0 0 42px color-mix(in oklch, var(--sn-accent) 34%, transparent),
        var(--sn-shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid color-mix(in oklch, var(--sn-border) 56%, transparent);
      background: color-mix(in oklch, var(--sn-surface-2) 64%, transparent);
      font-size: 13px;
      font-weight: 650;
    }

    .panel-badge {
      color: var(--sn-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .panel-body {
      display: grid;
      align-content: start;
      gap: 8px;
      padding: 12px;
      color: var(--sn-muted);
      font-size: 12px;
    }

    .row {
      height: 8px;
      border-radius: 999px;
      background: color-mix(in oklch, var(--sn-accent) 18%, transparent);
    }

    .row:nth-child(2) {
      width: 72%;
    }

    .row:nth-child(3) {
      width: 46%;
    }

    .ray {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 42vh;
      transform-origin: 50% 0%;
      transform: translate3d(-50%, 0, 260px) rotateX(66deg);
      background: linear-gradient(var(--sn-accent), transparent);
      opacity: 0.72;
      pointer-events: none;
    }

    @media (max-width: 820px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .side {
        border-right: 0;
        border-bottom: 1px solid color-mix(in oklch, var(--sn-border) 72%, transparent);
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <aside class="side">
      <div>
        <h1>Spatial layout provider preview</h1>
        <p class="meta">Pure layout data is projected by <code>symbiote-node/xr</code> into deterministic XR panels.</p>
      </div>

      <section class="control">
        <h2>Theme source controls</h2>
        <label for="hue">Hue</label>
        <input id="hue" type="range" min="160" max="288" value="212">
        <label for="scale">Spatial scale</label>
        <input id="scale" type="range" min="80" max="160" value="118">
        <label for="depth">Depth</label>
        <input id="depth" type="range" min="80" max="180" value="120">
      </section>

      <div id="status" class="status"></div>
    </aside>
    <section id="stage" class="stage">
      <div class="floor" aria-hidden="true"></div>
      <div id="space" class="space" aria-label="Projected spatial layout"></div>
      <div class="ray" aria-hidden="true"></div>
    </section>
  </main>

  <script type="module" src="spatial-layout.js"></script>
</body>

</html>
