<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TreeLayout Test</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--sn-bg, #1a1a1a);
      color: var(--sn-text, #f0f0f0);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    project-tabs {
      flex: 0 0 auto;
    }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }
    #content-area {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-width: 0;
    }
    #content-area panel-layout {
      position: absolute;
      inset: 0;
    }
    node-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    tree-log-panel {
      display: block;
      height: 100%;
      background: var(--sn-bg, #1a1a1a);
      color: var(--sn-success-color, #4caf50);
      font-family: var(--sn-font-mono, monospace);
      font-size: 11px;
      overflow-y: auto;
      padding: 8px;
    }
    #error-report {
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      background: var(--sn-bg, #1a1a1a);
      color: var(--sn-danger-color, #f44336);
      font-family: var(--sn-font-mono, monospace);
      font-size: 12px;
    }
    #error-report:empty {
      display: none;
    }
  </style>
</head>
<body>
  <project-tabs id="project-tabs"></project-tabs>
  <main>
    <layout-sidebar id="layout-sidebar"></layout-sidebar>
    <div id="content-area">
      <panel-layout id="layout-smoke" min-panel-size="160"></panel-layout>
    </div>
  </main>
  <pre id="error-report"></pre>

  <script type="importmap">
    {
      "imports": {
        "symbiote-node": "../index.js",
        "symbiote-node/ui": "../ui/index.js",
        "symbiote-node/layout": "../layout/index.js",
        "@symbiotejs/symbiote": "https://esm.sh/@symbiotejs/symbiote@3.2.1",
        "@symbiotejs/symbiote/": "https://esm.sh/@symbiotejs/symbiote@3.2.1/"
      }
    }
  </script>
  <script>
    const errorReport = document.getElementById('error-report');
    window.addEventListener('error', (event) => {
      errorReport.textContent += `${event.message}\n${event.filename}:${event.lineno}:${event.colno}\n`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      errorReport.textContent += `${event.reason?.stack || event.reason}\n`;
    });
  </script>
  <script type="module">
    import {
      NodeEditor, Node, SubgraphNode, Connection, Socket, Input, Output,
      computeTreeLayout, applyTheme, DEFAULT_THEME, LayoutTree,
    } from 'symbiote-node/ui';

    applyTheme(document.documentElement, DEFAULT_THEME);

    class TreeLogPanel extends HTMLElement {
      appendLine(text) {
        const line = document.createElement('div');
        line.textContent = text;
        this.appendChild(line);
        this.scrollTop = this.scrollHeight;
      }
    }

    customElements.define('tree-log-panel', TreeLogPanel);

    const tabs = document.getElementById('project-tabs');
    tabs.setTabs([
      {
        id: 'tree-layout',
        name: 'Tree layout test',
        icon: 'account_tree',
        color: DEFAULT_THEME.tokens['--sn-node-selected'],
        closeable: false,
      },
    ], 'tree-layout');

    const sidebar = document.getElementById('layout-sidebar');
    sidebar.routerSync = false;
    sidebar.setSections([
      { id: 'tree-layout', icon: 'account_tree', label: 'Tree layout' },
      { id: 'tree-log', icon: 'terminal', label: 'Layout log' },
    ]);

    const layout = document.getElementById('layout-smoke');
    layout.registerPanelType('tree-canvas', {
      title: 'Tree canvas',
      icon: 'account_tree',
      component: 'node-canvas',
    });
    layout.registerPanelType('tree-log', {
      title: 'Layout log',
      icon: 'terminal',
      component: 'tree-log-panel',
    });
    layout.setLayout(
      LayoutTree.createSplit(
        'vertical',
        LayoutTree.createPanel('tree-canvas'),
        LayoutTree.createPanel('tree-log'),
        0.78
      )
    );

    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    // --- Logging ---
    const logEl = layout.querySelector('tree-log-panel');
    function log(msg) {
      logEl.appendLine(`[${new Date().toISOString().slice(11,19)}] ${msg}`);
    }

    // --- Build a fake directory structure ---
    const S_IMP = new Socket('import'); S_IMP.color = DEFAULT_THEME.tokens['--sn-conn-color'];
    const S_EXP = new Socket('export'); S_EXP.color = DEFAULT_THEME.tokens['--sn-conn-color'];

    const editor = new NodeEditor();

    // Simulate a realistic directory tree:
    // src/
    //   src/core/         (5 files)
    //   src/network/      (3 files)
    //   src/io/           (2 files)
    //   src/compact/      (4 files)
    // tests/              (2 files)
    // web/
    //   web/panels/       (3 files)
    //   web/components/   (2 files)
    // vendor/             (1 file)

    const dirs = [
      { path: 'src/', label: 'src', files: 5 },
      { path: 'src/core/', label: 'core', files: 8 },
      { path: 'src/network/', label: 'network', files: 3 },
      { path: 'src/io/', label: 'io', files: 2 },
      { path: 'src/compact/', label: 'compact', files: 4 },
      { path: 'tests/', label: 'tests', files: 2 },
      { path: 'web/', label: 'web', files: 1 },
      { path: 'web/panels/', label: 'panels', files: 6 },
      { path: 'web/components/', label: 'components', files: 3 },
      { path: 'vendor/', label: 'vendor', files: 1 },
    ];

    const dirNodes = new Map(); // path → SubgraphNode
    const dirPaths = {};        // nodeId → path

    for (const dir of dirs) {
      const sg = new SubgraphNode(dir.label, { category: 'directory' });
      sg.params = { path: dir.path, isDirectory: true };
      sg.addOutput('out', new Output(S_EXP, ''));
      sg.addInput('in', new Input(S_IMP, ''));

      // Add dummy file nodes inside
      const inner = sg.getInnerEditor();
      for (let i = 0; i < dir.files; i++) {
        const fn = new Node(`file${i}.js`, { type: 'file', category: 'file' });
        inner.addNode(fn);
      }

      editor.addNode(sg);
      dirNodes.set(dir.path, sg);
      dirPaths[sg.id] = dir.path;
    }

    // Add some cross-directory edges
    const edges = [
      ['src/core/', 'src/network/'],
      ['src/core/', 'src/io/'],
      ['src/network/', 'src/io/'],
      ['src/compact/', 'src/core/'],
      ['web/panels/', 'src/core/'],
      ['web/panels/', 'src/network/'],
      ['web/components/', 'web/panels/'],
      ['tests/', 'src/core/'],
      ['vendor/', 'src/'],
    ];

    for (const [fromPath, toPath] of edges) {
      const fromNode = dirNodes.get(fromPath);
      const toNode = dirNodes.get(toPath);
      if (fromNode && toNode) {
        try {
          editor.addConnection(new Connection(fromNode, 'out', toNode, 'in'));
        } catch (e) { log(`Edge error: ${fromPath} → ${toPath}: ${e.message}`); }
      }
    }

    log(`Built editor: ${[...editor.getNodes()].length} nodes, ${[...editor.getConnections()].length} edges`);
    log(`dirPaths: ${JSON.stringify(dirPaths, null, 0)}`);

    // --- Canvas setup ---
    const canvas = layout.querySelector('node-canvas');
    canvas.setEditor(editor);
    canvas.setReadonly(true);
    canvas.setPathStyle('pcb');

    // --- Pass 1: Tree Layout ---
    log('--- Pass 1: TreeLayout with estimated sizes ---');
    const positions = computeTreeLayout(editor, {
      dirPaths,
      nodeWidth: 250,
      nodeHeight: 100,
      gapX: 40,
      gapY: 20,
      startX: 60,
      startY: 60,
    });

    canvas.setBatchMode(true);
    for (const [nodeId, pos] of Object.entries(positions)) {
      canvas.setNodePosition(nodeId, pos.x, pos.y);
      const node = [...editor.getNodes()].find(n => n.id === nodeId);
      log(`  ${node?.label || nodeId}: x=${pos.x.toFixed(0)}, y=${pos.y.toFixed(0)}`);
    }
    canvas.setBatchMode(false);
    canvas.refreshConnections();

    // --- Pass 2: Measure + relayout ---
    function doPass2() {
      log('--- Pass 2: Measuring DOM sizes ---');
      const nodeSizes = canvas.measureNodeSizes();
      for (const [id, size] of Object.entries(nodeSizes)) {
        const node = [...editor.getNodes()].find(n => n.id === id);
        log(`  ${node?.label || id}: ${size.w}×${size.h}`);
      }

      if (Object.keys(nodeSizes).length === 0) {
        log('ERROR: No DOM sizes measured!');
        return;
      }

      const corrected = computeTreeLayout(editor, {
        dirPaths, nodeSizes,
        nodeWidth: 250, nodeHeight: 100,
        gapX: 40, gapY: 20,
        startX: 60, startY: 60,
      });

      canvas.setBatchMode(true);
      for (const [nodeId, pos] of Object.entries(corrected)) {
        canvas.setNodePosition(nodeId, pos.x, pos.y);
        const node = [...editor.getNodes()].find(n => n.id === nodeId);
        log(`  ${node?.label || nodeId}: x=${pos.x.toFixed(0)}, y=${pos.y.toFixed(0)}`);
      }
      canvas.setBatchMode(false);
      canvas.refreshConnections();
      log('Pass 2 complete');
    }

    // Auto-run Pass 2 after DOM render
    requestAnimationFrame(() => {
      doPass2();
      // Auto-fit
      canvas.fitView?.();
    });
  </script>
</body>
</html>
